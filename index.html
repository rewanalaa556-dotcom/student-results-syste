<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Student Results System</h1>

        <div class="card p-4 shadow">

            <h3>Add New Student</h3>

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" id="studentName" class="form-control" placeholder="Enter student name">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 1</label>
                <input type="number" id="grade1" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 2</label>
                <input type="number" id="grade2" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 3</label>
                <input type="number" id="grade3" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Attendance</label>
                <input type="number" id="attendance" class="form-control">
            </div>

            <button id="addStudent" class="btn btn-primary mb-3">
                Add Student
            </button>

            <button id="mercyButton" class="btn btn-success">
                Activate Mercy Committee
            </button>

        </div>

        <div id="errorMessage" class="text-danger mt-3"></div>

        <div class="card p-3 mt-4">
            <h3>Students List</h3>
            <div id="studentsDisplay"></div>
        </div>

        <div class="card p-3 mt-4 mb-5">
            <h3>Final Report</h3>
            <div id="reportDisplay"></div>
        </div>

    </div>

    <script src="js/main.js"></script>

</body>
</html>
